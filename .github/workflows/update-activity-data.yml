name: Update activity data
on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [silo-release, release]
permissions:
  contents: write
concurrency:
  group: update-activity-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Summaries: Claude subscription 1 -> Claude subscription 2 -> OpenRouter -> Anthropic API
      - name: Install Claude Code (for Claude subscriptions)
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN_1 != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' }}
        run: npm install -g @anthropic-ai/claude-code
      - run: node scripts/update-activity-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit
        run: |
          git add src/data/activity.json src/data/activity-summaries.json src/data/activity-explainers.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update activity data"
          git pull --rebase origin main
          git push origin HEAD:main
