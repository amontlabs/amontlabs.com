name: Update Silo data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [silo-release]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-silo-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          if git diff --quiet -- src/data/silo.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/silo.json
          git commit -m "chore: update Silo data"
          git push origin HEAD:main
